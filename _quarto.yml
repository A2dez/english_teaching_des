  description: "English pronunciation, communication coaching and workshops."
  site-url: "https://YOUR-GITHUB-USERNAME.github.io/YOUR-REPOSITORY/"
  favicon: images/favicon.svg

  navbar:
    title: "English with Des"
    background: "#17324D"
    foreground: "#FFFFFF"
    left:
      - href: index.qmd
        text: Home
      - href: services.qmd
        text: Services
      - href: about.qmd
        text: About
      - href: resources.qmd
